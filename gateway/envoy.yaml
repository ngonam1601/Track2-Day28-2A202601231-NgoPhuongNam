static_resources:
  listeners:
    - name: public
      address:
        socket_address: {address: 0.0.0.0, port_value: 8080}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress
                generate_request_id: true
                use_remote_address: true
                tracing:
                  client_sampling: {value: 100.0}
                  random_sampling: {value: 100.0}
                  overall_sampling: {value: 100.0}
                  provider:
                    name: envoy.tracers.opentelemetry
                    typed_config:
                      "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                      service_name: lab28-gateway
                      grpc_service:
                        envoy_grpc: {cluster_name: otel_collector}
                        timeout: 0.5s
                route_config:
                  name: routes
                  virtual_hosts:
                    - name: lab28
                      domains: ["*"]
                      response_headers_to_add:
                        - header: {key: x-request-id, value: "%REQ(X-REQUEST-ID)%"}
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                      routes:
                        - match: {path: /healthz}
                          direct_response: {status: 200, body: {inline_string: "ok\n"}}
                        # Ingestion is decoupled from retrieval: accepting a
                        # feedback event only needs the API process to be live.
                        # Keep it available while the serving readiness check
                        # deliberately ejects a pod missing a mandatory
                        # retrieval dependency.
                        - match: {prefix: /api/v1/feedback}
                          decorator: {operation: lab28.gateway.request}
                          route: {cluster: ingestion_api, timeout: 120s}
                        - match: {prefix: /}
                          decorator: {operation: lab28.gateway.request}
                          route: {cluster: api, timeout: 120s}
                http_filters:
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: lab28
                      token_bucket:
                        max_tokens: 10
                        tokens_per_fill: 10
                        fill_interval: 1s
                      filter_enabled:
                        runtime_key: local_rate_limit_enabled
                        default_value: {numerator: 100, denominator: HUNDRED}
                      filter_enforced:
                        runtime_key: local_rate_limit_enforced
                        default_value: {numerator: 100, denominator: HUNDRED}
                      response_headers_to_add:
                        - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          header: {key: x-lab28-rate-limited, value: "true"}
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: api
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: api, port_value: 8000}
      health_checks:
        # A real remote vLLM identity probe can exceed two seconds.  Do not
        # eject an otherwise ready API merely because the health check itself
        # timed out; recovery still remains well inside the J4 deadline.
        - timeout: 10s
          interval: 2s
          unhealthy_threshold: 1
          healthy_threshold: 1
          # Readiness decides whether Envoy can route. A mandatory dependency
          # outage ejects the upstream instead of proxying to an unready pod.
          http_health_check: {path: /ready}
      common_lb_config:
        healthy_panic_threshold: {value: 0}
    - name: otel_collector
      type: STRICT_DNS
      connect_timeout: 2s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config: {http2_protocol_options: {}}
      load_assignment:
        cluster_name: otel_collector
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: otel-collector, port_value: 4317}
    - name: ingestion_api
      type: STRICT_DNS
      connect_timeout: 2s
      load_assignment:
        cluster_name: ingestion_api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: api, port_value: 8000}
      health_checks:
        - timeout: 2s
          interval: 2s
          unhealthy_threshold: 1
          healthy_threshold: 1
          http_health_check: {path: /health}
      common_lb_config:
        healthy_panic_threshold: {value: 0}
admin:
  address:
    socket_address: {address: 0.0.0.0, port_value: 9901}
